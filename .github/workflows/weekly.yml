name: weekly projections, freeze, scoring and dashboard

# Tuesday and Wednesday mornings (US): after Monday night's game and the first stat
# corrections, well before Thursday's kickoff. The database is rebuilt from nflverse on
# each run, so no hosted database is needed. The run commits the new ledger week,
# the live record and the rebuilt index.html back to the repository.
on:
  schedule:
    - cron: "41 13 * * 2"     # Tuesday 13:41 UTC
    - cron: "41 13 * * 3"     # Wednesday 13:41 UTC (the freeze is skipped if Tuesday already froze the week)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nflprop
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nflprop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly pipeline
        run: python -m proplab.live.weekly
      - name: Tests
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.txt || {
            grep -E "^(FAILED|ERROR) " pytest.txt | sed 's/^/::error title=Test failed::/'
            grep -E "^E  " pytest.txt | head -20 | sed 's/^/::error title=Detail::/'
            exit 1; }
      - name: Commit results
        run: |
          git config user.name "proplab-bot"
          git config user.email "proplab-bot@users.noreply.github.com"
          git add ledger phase1/projections.json phase3 phase4/week_sims.json phase5 phase6/dashboard_scheme.json index.html
          git diff --cached --quiet || git commit -m "Weekly run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
